<!DOCTYPE html>
<html>
<head>
    <style>
        body { background: transparent; margin: 0; font-family: 'Segoe UI', sans-serif; overflow: hidden; display: flex; justify-content: center; padding-top: 20px; }
        .score-bar { display: flex; align-items: center; background: rgba(20, 20, 20, 0.9); color: white; border-radius: 4px; overflow: hidden; box-shadow: 0 4px 15px rgba(0,0,0,0.5); border-bottom: 4px solid var(--accent, #ffd700); }
        .team { display: flex; align-items: center; padding: 10px 20px; gap: 12px; }
        .logo { width: 45px; height: 45px; object-fit: contain; filter: drop-shadow(0 0 2px black); }
        .name { font-weight: 800; font-size: 24px; letter-spacing: 1px; }
        .score { font-size: 36px; font-weight: 900; background: #000; padding: 0 20px; min-width: 50px; text-align: center; color: var(--accent, #ffd700); }
        .timer { font-family: 'Courier New', monospace; font-size: 30px; padding: 0 20px; font-weight: bold; background: #222; height: 100%; display: flex; align-items: center; }
    </style>
</head>
<body>
    <div class="score-bar">
        <div class="team">
            <img id="lLogo" src="" style="display:none" class="logo">
            <span id="lName" class="name">LOCAL</span>
        </div>
        <div id="lScore" class="score">0</div>
        <div id="vScore" class="score">0</div>
        <div class="team">
            <span id="vName" class="name">VISITA</span>
            <img id="vLogo" src="" style="display:none" class="logo">
        </div>
        <div id="clock" class="timer">00:00</div>
    </div>

    <script>
        function sync() {
            const data = JSON.parse(localStorage.getItem('futbol_obs') || '{}');
            if(!data.lName) return;
            document.getElementById('lName').innerText = data.lName;
            document.getElementById('vName').innerText = data.vName;
            document.getElementById('lScore').innerText = data.lScore;
            document.getElementById('vScore').innerText = data.vScore;
            document.getElementById('clock').innerText = data.time;
            document.documentElement.style.setProperty('--accent', data.color);
            if(data.lLogo) { document.getElementById('lLogo').src = data.lLogo; document.getElementById('lLogo').style.display = 'block'; }
            if(data.vLogo) { document.getElementById('vLogo').src = data.vLogo; document.getElementById('vLogo').style.display = 'block'; }
        }
        window.addEventListener('storage', sync);
        sync();
    </script>
</body>
</html>
