<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        body { font-family: system-ui; padding: 30px; background: #1a1a1a; color: white; display: flex; justify-content: center; }
        .card { background: #2a2a2a; padding: 25px; border-radius: 12px; width: 450px; border: 1px solid #444; }
        .group { margin-bottom: 20px; border-bottom: 1px solid #444; padding-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-size: 12px; color: #aaa; text-transform: uppercase; }
        input { width: 100%; padding: 10px; margin-bottom: 10px; border-radius: 4px; border: none; background: #333; color: white; }
        .btns { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        button { padding: 12px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; transition: 0.2s; }
        .btn-score { background: #ffd700; color: black; font-size: 18px; }
        .btn-timer { background: #3498db; color: white; }
        .btn-save { background: #2ecc71; color: white; width: 100%; margin-top: 20px; }
        button:active { transform: scale(0.95); }
    </style>
</head>
<body>
    <div class="card">
        <h2>Panel de Transmisión</h2>
        <div class="group">
            <label>Equipo Local</label>
            <input type="text" id="inLName" placeholder="Nombre">
            <input type="file" id="inLLogo" accept="image/*">
            <label>Equipo Visitante</label>
            <input type="text" id="inVName" placeholder="Nombre">
            <input type="file" id="inVLogo" accept="image/*">
            <input type="color" id="inColor" value="#ffd700">
        </div>
        <div class="btns">
            <button class="btn-score" onclick="addScore('l')">GOL LOCAL</button>
            <button class="btn-score" onclick="addScore('v')">GOL VISITA</button>
        </div>
        <div class="btns" style="margin-top:10px">
            <button class="btn-timer" id="tBtn" onclick="toggleT()">INICIAR RELOJ</button>
            <button class="btn-timer" style="background:#e74c3c" onclick="resetT()">RESET</button>
        </div>
        <button class="btn-save" onclick="saveConfig()">ACTUALIZAR NOMBRES Y COLOR</button>
    </div>

    <script>
        let state = { lName: 'LOCAL', vName: 'VISITA', lScore: 0, vScore: 0, time: '00:00', color: '#ffd700', lLogo: '', vLogo: '' };
        let sec = 0, active = false, timer;

        function loadImg(e, side) {
            const f = e.target.files[0];
            const r = new FileReader();
            r.onload = () => { state[side+'Logo'] = r.result; save(); };
            if(f) r.readAsDataURL(f);
        }
        document.getElementById('inLLogo').onchange = (e) => loadImg(e, 'l');
        document.getElementById('inVLogo').onchange = (e) => loadImg(e, 'v');

        function saveConfig() {
            state.lName = document.getElementById('inLName').value || 'LOCAL';
            state.vName = document.getElementById('inVName').value || 'VISITA';
            state.color = document.getElementById('inColor').value;
            save();
        }

        function addScore(s) { state[s+'Score']++; save(); }
        function save() { localStorage.setItem('futbol_obs', JSON.stringify(state)); }

        function toggleT() {
            active = !active;
            document.getElementById('tBtn').innerText = active ? 'PAUSAR' : 'REANUDAR';
            if(active) {
                timer = setInterval(() => {
                    sec++;
                    let m = Math.floor(sec/60), s = sec%60;
                    state.time = `${m.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')}`;
                    save();
                }, 1000);
            } else clearInterval(timer);
        }
        function resetT() { sec = 0; state.time = "00:00"; save(); }
    </script>
</body>
</html>
